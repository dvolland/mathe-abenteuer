<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#9B5DE5"/>
    </linearGradient>
  </defs>
  <!-- Full background (needed for maskable) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Rounded overlay for "any" display -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- 5-pointed star, centered at 256,230 -->
  <polygon
    points="256,58 300,175 424,175 326,250 362,368 256,295 150,368 186,250 88,175 212,175"
    fill="#FFD93D"
    stroke="#FFB347"
    stroke-width="6"
    stroke-linejoin="round"/>

  <!-- Shine on star -->
  <polygon
    points="256,58 300,175 424,175 326,250 362,368 256,295 150,368 186,250 88,175 212,175"
    fill="url(#shine)"
    opacity="0.18"/>
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Math symbols row -->
  <text x="256" y="464" font-size="68" text-anchor="middle"
        fill="rgba(255,255,255,0.88)"
        font-family="Arial,Helvetica,sans-serif"
        font-weight="900" letter-spacing="6">× ÷ =</text>
</svg>
